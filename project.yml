name: Postit
options:
  bundleIdPrefix: com.peter
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: 7VAL2U8BVL
    CODE_SIGN_STYLE: Automatic

targets:
  Postit_iOS:
    type: application
    platform: iOS
    info:
      path: Resources/Info-iOS.plist
      properties:
        # 실행 화면을 포스트잇 노랑으로 (앱이 켜질 때 빈 화면이 번쩍이지 않게)
        UILaunchScreen:
          UIColorName: LaunchBackground
        # iCloud 변경 알림을 백그라운드에서 받아 다른 기기의 변경을 미리 반영
        UIBackgroundModes:
          - remote-notification
    sources:
      - path: Sources
        excludes:
          - "Mac/**"
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter.postit
        PRODUCT_NAME: Postit
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Resources/Postit-iOS.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Postit
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Postit_macOS:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter.postit
        PRODUCT_NAME: Postit
        CODE_SIGN_ENTITLEMENTS: Resources/Postit-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Postit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # 시험용: 실제 앱(com.peter.postit)과 샌드박스·설정·단축키가 겹치지 않는 별도 앱.
  # iCloud는 같은 컨테이너의 Development 환경을 쓴다 (새 데이터 구조를 만든 뒤 Production에 배포).
  Postit_macOS_Dev:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.peter.postit.dev
        PRODUCT_NAME: Postit Dev
        CODE_SIGN_ENTITLEMENTS: Resources/Postit-macOS-Dev.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Postit Dev
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) POSTIT_DEV"
